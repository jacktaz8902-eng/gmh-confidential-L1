<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문서보안 단말기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9eef3;
    --panel: #ffffff;
    --ink: #17212b;
    --muted: #64707d;
    --line: #d5dde5;
    --brand: #1f6fb8;
    --brand-deep: #163f7a;
    --danger: #c23b32;
    --ok: #2f8a4e;
    --memo: #fff6c4;
    --memo-ink: #3d3416;
    --key: #f3f6f9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans KR', 'Malgun Gothic', sans-serif;
    min-height: 100vh;
  }
  .wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding: 32px 16px 48px;
  }
  header.brand {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px;
  }
  .logo {
    width: 40px; height: 40px; flex: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--brand), var(--brand-deep));
    display: grid; place-items: center;
  }
  .logo svg { width: 22px; height: 22px; }
  .brand h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  .brand p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    justify-items: center;
  }
  .grid .terminal { width: 100%; max-width: 380px; }
  .evidence {
    margin: 0; width: 100%;
    background: #f7f7f5;
    padding: 10px 10px 12px;
    border-radius: 3px;
    box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 14px 30px -16px rgba(20,30,50,.5);
    transform: rotate(-0.4deg);
  }
  .hint-row {
    display: flex; align-items: center; justify-content: center; gap: 28px;
    background: #fff; border: 1px solid #e2e2e2; padding: 20px;
  }
  .hint-img { display: block; height: auto; cursor: zoom-in; }
  .hint-text { width: 34%; max-width: 330px; }
  .hint-boxes { width: 58%; max-width: 560px; }
  @media (max-width: 640px) {
    .hint-row { flex-direction: column; gap: 22px; padding: 16px 10px; }
    .hint-text { width: 78%; }
    .hint-boxes { width: 100%; }
  }
  .evidence figcaption { font-size: 12px; color: var(--muted); padding: 8px 4px 0; text-align: center; }
  .hint-label {
    display: inline-block;
    font-size: 18px; font-weight: 700;
    color: var(--brand-deep);
    padding: 4px 4px 10px;
  }
  .zoom {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(10,15,20,.88);
    align-items: center; justify-content: center;
    padding: 16px; cursor: zoom-out;
  }
  .zoom.on { display: flex; }
  .zoom img { max-width: 100%; max-height: 100%; background: #fff; border-radius: 4px; }

  /* sticky memo with the puzzle */
  .memo {
    background: var(--memo);
    color: var(--memo-ink);
    border-radius: 4px;
    padding: 22px 22px 18px;
    box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 10px 24px -12px rgba(60,50,10,.35);
    transform: rotate(-0.6deg);
    position: relative;
  }
  .memo::before {
    content: ""; position: absolute; top: -10px; left: 50%;
    width: 90px; height: 22px; transform: translateX(-50%) rotate(2deg);
    background: rgba(255,255,255,.55);
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  .memo h2 { font-size: 15px; margin: 0 0 4px; }
  .memo .sub { font-size: 13px; margin: 0 0 16px; opacity: .8; }
  .clue {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 0;
    border-top: 1px dashed rgba(61,52,22,.25);
  }
  .clue:first-of-type { border-top: 0; }
  .digits { display: flex; gap: 5px; flex: none; }
  .digits span {
    width: 30px; height: 36px;
    display: grid; place-items: center;
    font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 18px;
    background: rgba(255,255,255,.7);
    border: 1px solid rgba(61,52,22,.2);
    border-radius: 4px;
  }
  .clue p { margin: 0; font-size: 14px; line-height: 1.45; }
  .memo .foot { margin: 14px 0 0; font-size: 12px; opacity: .75; }

  /* terminal */
  .terminal {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 12px 30px -18px rgba(20,40,70,.35);
  }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700;
    color: var(--danger);
    border: 1px solid currentColor;
    border-radius: 999px;
    padding: 3px 10px;
  }
  .terminal h3 { margin: 12px 0 4px; font-size: 16px; }
  .terminal .desc { margin: 0 0 18px; font-size: 13px; color: var(--muted); }

  .slots { display: flex; gap: 10px; justify-content: center; margin-bottom: 8px; }
  .slot {
    width: 54px; height: 64px;
    border: 2px solid var(--line);
    border-radius: 10px;
    display: grid; place-items: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 600;
    background: #fbfcfd;
    transition: border-color .15s, background .15s;
  }
  .slot.active { border-color: var(--brand); }
  .slot.filled { background: #eef4fb; }
  .slots.bad .slot { border-color: var(--danger); background: #fcefee; }
  .slots.good .slot { border-color: var(--ok); background: #ecf6ef; }
  .shake { animation: shake .4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
  }
  .status {
    min-height: 20px; text-align: center;
    font-size: 13px; color: var(--muted);
    margin: 4px 0 14px;
  }
  .status.bad { color: var(--danger); }
  .status.good { color: var(--ok); font-weight: 700; }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pad button {
    font: inherit; font-family: 'IBM Plex Mono', monospace;
    font-size: 20px; font-weight: 600;
    height: 52px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--key);
    color: var(--ink);
    cursor: pointer;
    transition: background .1s, transform .05s;
  }
  .pad button:hover { background: #e7edf3; }
  .pad button:active { transform: scale(.97); }
  .pad .fn { font-family: 'IBM Plex Sans KR', sans-serif; font-size: 14px; font-weight: 500; }
  .pad .go { background: var(--brand); border-color: var(--brand); color: #fff; }
  .pad .go:hover { background: var(--brand-deep); }
  .pad button:disabled { opacity: .5; cursor: wait; }

  /* viewer */
  #viewer { display: none; }
  .vbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: rgba(233,238,243,.92);
    backdrop-filter: blur(6px);
    padding: 12px 0;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .vbar .title { font-weight: 700; font-size: 15px; flex: 1; min-width: 160px; }
  .vbar .title small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .vbar button {
    font: inherit; font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel); color: var(--ink);
    cursor: pointer;
  }
  .vbar button:hover { border-color: var(--brand); }
  #pages { display: flex; flex-direction: column; gap: 16px; align-items: center; }
  #pages canvas {
    width: 100%; height: auto;
    background: #fff;
    border-radius: 6px;
    box-shadow: 0 8px 24px -14px rgba(20,40,70,.45);
  }
  #pages iframe { width: 100%; height: 85vh; border: 0; border-radius: 6px; background: #fff; }
  .loading { padding: 40px; color: var(--muted); font-size: 14px; }
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const slotsEl = document.getElementById('slots');
const statusEl = document.getElementById('status');
const pad = document.getElementById('pad');
let code = '', busy = false, fails = 0, blobUrl = null;

for (let i = 0; i < LEN; i++) {
  const d = document.createElement('div'); d.className = 'slot'; slotsEl.appendChild(d);
}
function draw() {
  [...slotsEl.children].forEach((s, i) => {
    s.textContent = code[i] ? '•' : '';
    s.classList.toggle('filled', !!code[i]);
    s.classList.toggle('active', i === code.length);
  });
}
function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = 'status' + (cls ? ' ' + cls : ''); }

function press(k) {
  if (busy) return;
  slotsEl.classList.remove('bad');
  if (k === 'del') { code = code.slice(0, -1); }
  else if (k === 'ok') { if (code.length === LEN) tryUnlock(); else setStatus(LEN + '자리를 모두 입력하세요', 'bad'); }
  else if (/^\d$/.test(k) && code.length < LEN) { code += k; }
  draw();
}
pad.addEventListener('click', e => { const b = e.target.closest('button'); if (b) press(b.dataset.k); });
document.addEventListener('keydown', e => {
  if (document.getElementById('lock').style.display === 'none') return;
  if (/^\d$/.test(e.key)) press(e.key);
  else if (e.key === 'Backspace') press('del');
  else if (e.key === 'Enter') press('ok');
});

async function decrypt(pin) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' },
    base, { name: 'AES-CBC', length: 256 }, false, ['decrypt']);
  const out = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-CBC', iv: b64(IV) }, key, b64(DATA)));
  // %PDF header check guards against a wrong key that happens to pass padding
  if (out[0] !== 0x25 || out[1] !== 0x50 || out[2] !== 0x44 || out[3] !== 0x46) throw new Error('bad');
  return out;
}

async function tryUnlock() {
  if (!window.crypto || !crypto.subtle) { setStatus('이 브라우저에서는 열 수 없습니다 (Chrome/Edge 권장)', 'bad'); return; }
  busy = true; [...pad.children].forEach(b => b.disabled = true);
  setStatus('확인 중…');
  try {
    const bytes = await decrypt(code);
    slotsEl.classList.add('good');
    setStatus('인증 완료. 문서를 엽니다.', 'good');
    setTimeout(() => openViewer(bytes), 600);
  } catch (e) {
    fails++;
    slotsEl.classList.add('bad', 'shake');
    setTimeout(() => slotsEl.classList.remove('shake'), 400);
    setStatus('비밀번호가 틀렸습니다' + (fails > 1 ? ' (' + fails + '회 실패)' : ''), 'bad');
    code = '';
    draw();
  } finally {
    busy = false; [...pad.children].forEach(b => b.disabled = false);
  }
}

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}

async function openViewer(bytes) {
  document.getElementById('lock').style.display = 'none';
  document.getElementById('viewer').style.display = 'block';
  const pages = document.getElementById('pages');
  const info = document.getElementById('pageinfo');
  try {
    const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    if (!window.pdfjsLib) await loadScript(base + 'pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js';
    const doc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
    pages.innerHTML = '';
    info.textContent = '총 ' + doc.numPages + '쪽';
    const width = Math.min(pages.clientWidth || 880, 880);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (let i = 1; i <= doc.numPages; i++) {
      const page = await doc.getPage(i);
      const v1 = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: (width / v1.width) * dpr });
      const c = document.createElement('canvas');
      c.width = vp.width; c.height = vp.height;
      pages.appendChild(c);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
  } catch (e) {
    // offline or pdf.js blocked: fall back to the browser's own PDF viewer
    blobUrl = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    pages.innerHTML = '<iframe src="' + blobUrl + '#toolbar=0" title="문서"></iframe>';
    info.textContent = '브라우저 기본 뷰어로 표시 중';
  }
}

document.getElementById('relock').addEventListener('click', () => {
  if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
  document.getElementById('pages').innerHTML = '<div class="loading">문서를 불러오는 중…</div>';
  document.getElementById('viewer').style.display = 'none';
  document.getElementById('lock').style.display = '';
  code = ''; fails = 0; slotsEl.classList.remove('good', 'bad');
  setStatus('키패드나 키보드로 입력하세요'); draw();
});

const zoom = document.getElementById('zoom');
document.querySelectorAll('.hint-img').forEach(img => img.addEventListener('click', () => {
  document.getElementById('zoomImg').src = img.src; zoom.classList.add('on');
}));
zoom.addEventListener('click', () => zoom.classList.remove('on'));

draw();
</script>
